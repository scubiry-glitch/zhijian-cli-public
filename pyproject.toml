[project]
name = "zyt"
version = "0.1.0"
description = "贝壳智见开放 API CLI"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
zyt = "zyt.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["python"]

[tool.pytest.ini_options]
pythonpath = ["python"]
testpaths = ["python/tests"]
